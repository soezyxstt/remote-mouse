name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-checks:
    name: Linux Gate & Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: npm ci

      - name: Verify dependency tree
        run: npm ls --all

      - name: Format check (TypeScript/Markdown/JSON)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build web surfaces
        run: npm run build

      - name: Install Playwright browsers & OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Playwright visual regression tests
        run: npm run test:visual

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust test suite
        run: cargo test --workspace

  windows-rust:
    name: Windows Native Rust Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo check on Windows
        run: cargo check --workspace

      - name: Cargo test on Windows
        run: cargo test --workspace
